# Two-arch desktop DMG builds — the Livebook pattern (livebook-dev/livebook
# release.yml): one native runner per architecture, each building its own
# native ERTS. Never lipo the Erlang tree — a universal ERTS kills the JIT on
# the Intel slice (daily-growth/roadmaps/platform/APPLE_ROADMAP.md §III.G).
#
# Signing and notarization are wired but SECRET-GATED. With no APPLE_CERTIFICATE
# secret the whole path is skipped and this job produces unsigned artifacts —
# fine for CI verification, not for distribution. Add the secrets and the same
# job starts producing signed, notarized, stapled DMGs with no edit here.
#
# The secrets, all base64 where noted:
#   APPLE_CERTIFICATE           Developer ID Application .p12, base64
#   APPLE_CERTIFICATE_PASSWORD  the .p12 export password
#   then EITHER (preferred, revocable):
#     APPLE_API_KEY_P8          App Store Connect .p8 key, base64
#     APPLE_API_KEY_ID          the key's ID
#     APPLE_API_ISSUER_ID       the issuer UUID
#   OR:
#     APPLE_ID / APPLE_PASSWORD (app-specific) / APPLE_TEAM_ID
#
# And the SECOND, unrelated signature — the updater's (UPDATE_ROADMAP G-18):
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (the file's contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password it was generated with
#
# Generate the pair once, with:
#   cargo tauri signer generate -w ~/.buster-claw/updater.key
#
# Then BACK THE PRIVATE KEY UP OFFLINE BEFORE THE FIRST RELEASE. Anyone holding
# it can push arbitrary code to every install, and there is no revocation — the
# public key is compiled into every shipped binary, so a rotated key is REJECTED
# by the installs you were trying to reach. Dangerous to leak, dangerous to lose.
#
# Deliberately absent: any step that signs the OTP tree. That lives in
# scripts/codesign_release.sh, called by build_desktop.sh, so local and CI
# builds sign identically rather than CI keeping a second copy that drifts.
#
# Also deliberately absent: the feed assembly. That lives in
# scripts/build_update_feed.sh, for the same reason.
name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MIX_ENV: prod
      # Flips true when the Developer ID cert secret exists (payday).
      HAVE_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # The OTHER signature (UPDATE_ROADMAP G-18). Unrelated to Apple's: this one
      # proves an update came from us, and the updater checks it before installing.
      # build_desktop.sh turns on updater artifacts only when this is present, so
      # a keyless verification run still produces a working unsigned bundle.
      HAVE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Versions pinned to .tool-versions, same as ci.yml.
      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4.2"
          elixir-version: "1.19.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri
          key: ${{ matrix.arch }}

      - name: Cache mix deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.arch }}-mix-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-mix-prod-

      # Keep this in the same 2.x minor series as the `tauri` crate in
      # desktop/tauri/Cargo.lock. The CLI is what bundles, signs, notarizes, and
      # staples what the crate builds, so a CLI three minor versions behind the
      # crate means shipping a signing path nobody has ever run locally.
      #
      # cargo install is slow but rust-cache keeps the binary across runs, so
      # compare the VERSION rather than merely checking the binary exists: the
      # cache persists ~/.cargo/bin, and an existence check would pin CI to
      # whatever was installed the first time this workflow ever ran. Bumping the
      # version below would then be a silent no-op on every warm run, which is
      # exactly how this drifted to 2.8.0 while the crate moved to 2.11.
      - name: Install tauri-cli
        env:
          TAURI_CLI_VERSION: "2.11.4"
        run: |
          set -euo pipefail
          have="$(cargo-tauri --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$have" != "$TAURI_CLI_VERSION" ]; then
            echo "tauri-cli: have '${have:-none}', want $TAURI_CLI_VERSION"
            cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked --force
          else
            echo "tauri-cli $TAURI_CLI_VERSION already installed"
          fi
          cargo-tauri --version

      # Import the Developer ID cert into a throwaway keychain that lives only
      # for this job. Never the default login keychain: a hosted runner is
      # shared infrastructure, and a keychain that outlives the job is a private
      # key someone else's workflow could reach.
      #
      # The signing pass over the OTP tree is NOT here — it lives inside
      # build_desktop.sh (scripts/codesign_release.sh), which runs it between
      # staging the release and bundling. That keeps local and CI builds signing
      # identically instead of CI having a second, drifting implementation.
      - name: Import Developer ID certificate
        if: env.HAVE_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/busterclaw-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Auto-lock after an hour so a hung job cannot leave it open forever.
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on a GUI authorization prompt that no
          # runner can answer, and the job hangs until it times out rather than
          # failing with anything readable.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # PREPEND to the search list, never replace it. The system keychains
          # hold the Apple intermediate and root certs; drop them and every
          # signature fails to build a chain to a trusted anchor.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"

          if [ -z "$IDENTITY" ]; then
            echo "FATAL: no Developer ID Application identity in the imported cert." >&2
            echo "       Found instead:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            echo "       A Developer ID APPLICATION cert signs the .app and .dmg." >&2
            echo "       A Developer ID INSTALLER cert signs .pkg files and is not it." >&2
            exit 1
          fi

          # The identity name is the public seller string, not a secret.
          echo "Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Tauri notarizes and staples on its own when these are present during
      # `tauri build`. Two credential shapes are accepted; the App Store Connect
      # API key is preferred (revocable, scoped, no Apple ID password in CI) and
      # the Apple ID + app-specific password path is the fallback.
      - name: Stage notarization credentials
        if: env.HAVE_APPLE_CERT == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            echo "Notarization: App Store Connect API key"
          elif [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "Notarization: Apple ID + app-specific password"
          else
            # Signed but un-notarized is worse than unsigned: it looks finished
            # and still refuses to open on a stranger's Mac, because Gatekeeper
            # wants the notary ticket, not merely a valid signature.
            echo "FATAL: a signing cert is present but no notarization credentials are." >&2
            echo "       Set either APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER_ID," >&2
            echo "       or APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID." >&2
            exit 1
          fi

      # Fail CLOSED, before anything is built. A tag is a release, and a release
      # with no minisign key produces a bundle no installed copy can ever update
      # to — which is not discovered at build time, or at install time, but months
      # later when a security fix does not reach anyone. workflow_dispatch stays
      # keyless-friendly on purpose: that is the verification path.
      - name: A tagged release must be updatable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ "${HAVE_SIGNING_KEY}" != "true" ]; then
            echo "FATAL: tagged release with no TAURI_SIGNING_PRIVATE_KEY." >&2
            echo "" >&2
            echo "Every install checks a minisign signature before applying an update," >&2
            echo "and the public key is compiled into every shipped binary. A release" >&2
            echo "built without the key cannot be updated to, ever, by anyone." >&2
            echo "" >&2
            echo "Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD," >&2
            echo "or build with workflow_dispatch if you only want a verification run." >&2
            exit 1
          fi
          echo "update signing key present"

      - name: Build DMG
        run: ./scripts/build_desktop.sh

      # Prove the ARTIFACT, not the source (APPLE_ROADMAP G-5). Every other gate
      # in this repo tests the tree; this is the only one that tests what we
      # actually ship. BLOCKER-1 — a truncated edit that left Resources/release
      # empty — sailed through five green jobs for six days because the only
      # thing asserted about the DMG was that the file existed.
      #
      # Deliberately BEFORE the signature and upload steps: a bundle that cannot
      # boot must fail the job rather than get signed, notarized, and published.
      # Deliberately NOT gated on HAVE_APPLE_CERT either — an unsigned CI build
      # still has to be a working one.
      #
      # This drives the bundled release directly rather than launching the .app:
      # no window server, no Keychain, no Chromium, no network. scripts/
      # smoke_desktop.sh covers the GUI and native-bridge half and stays a manual
      # pre-release step until it has been validated on a hosted runner.
      - name: Boot the packaged release
        run: ./scripts/smoke_release_boot.sh

      # The macOS floor we advertise must be one the bundle can actually meet
      # (APPLE_ROADMAP G-16). Measured 08-01: the shell was built for 11.0 while
      # every one of the 24 OTP binaries required 14.0, and the bundle advertised
      # 11.0 — so on macOS 11 through 13 it would install, pass Gatekeeper, launch
      # the shell, and then have dyld reject beam.smp.
      #
      # This runs on EVERY build rather than being a one-time correction, because
      # the VM's floor is inherited from whichever Erlang built the release. A new
      # runner image or a bumped OTP silently moves it, and the symptom appears
      # only on machines older than any we build on.
      - name: Verify the advertised macOS floor
        run: ./scripts/check_macos_floor.sh

      # The definition of "Apple is done" (APPLE_ROADMAP III.J), asserted in CI
      # rather than trusted. Each check below has failed for somebody, and every
      # one of them fails silently at build time and loudly on a user's Mac.
      - name: Verify signature, notarization, and staple
        if: env.HAVE_APPLE_CERT == 'true'
        run: |
          set -euo pipefail
          APP="desktop/tauri/target/release/bundle/macos/Buster Claw.app"

          echo "==> Signature is structurally valid"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "==> Signed by Developer ID, with the hardened runtime"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/cs.txt
          grep -q 'Authority=Developer ID Application' /tmp/cs.txt
          grep -q 'flags=.*runtime' /tmp/cs.txt

          # The one that actually predicts whether a stranger can open it.
          # "accepted" alone is not enough: an unnotarized build can still be
          # accepted locally because this machine signed it.
          echo "==> Gatekeeper accepts it as notarized"
          spctl -a -t exec -vvv "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q 'source=Notarized Developer ID' /tmp/spctl.txt

          # Stapling is what makes a first launch work with no network. Without
          # it the app is notarized on Apple's servers and unopenable on a plane.
          echo "==> Ticket is stapled to the .app and the .dmg"
          xcrun stapler validate "$APP"
          for dmg in desktop/tauri/target/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$dmg"
          done

          # beam.smp is spawned as its own process and does not inherit the
          # shell's entitlements. If this is missing, everything above still
          # passes and the VM dies at launch on the user's machine.
          echo "==> beam.smp carries its own allow-jit"
          BEAM="$(find "$APP/Contents/Resources/release" -name beam.smp -print -quit)"
          codesign -d --entitlements - --xml "$BEAM" 2>/dev/null \
            | grep -q 'com.apple.security.cs.allow-jit'

          # A "universal" Tauri shell wrapping an x86_64 ERTS is an Intel app
          # with extra steps. Check the VM, not the shell binary.
          echo "==> The bundled VM is genuinely ${{ matrix.arch }}"
          lipo -archs "$BEAM"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: buster-claw-dmg-${{ matrix.arch }}
          if-no-files-found: error
          path: desktop/tauri/target/release/bundle/dmg/*.dmg

      # Rename to a canonical, URL-safe name before anything downstream sees it.
      # The product name has a space in it ("Buster Claw.app.tar.gz"), and this
      # name becomes a URL inside latest.json that every installed app fetches —
      # so the renaming is not cosmetic. Found by GLOB rather than by assuming
      # Tauri's exact output name, because that name is the bundler's to change
      # and a wrong literal here fails at release time, not at build time.
      - name: Stage the updater artifacts
        if: env.HAVE_SIGNING_KEY == 'true'
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SRC="desktop/tauri/target/release/bundle/macos"

          tarball="$(find "$SRC" -name '*.app.tar.gz' -print -quit)"
          if [ -z "$tarball" ]; then
            echo "FATAL: build_desktop.sh ran with a signing key but produced no" >&2
            echo "       .app.tar.gz under $SRC" >&2
            ls -A "$SRC" >&2 || true
            exit 1
          fi
          [ -f "$tarball.sig" ] || { echo "FATAL: $tarball has no .sig" >&2; exit 1; }

          mkdir -p update-artifacts
          dest="update-artifacts/BusterClaw_${VERSION}_${{ matrix.arch }}.app.tar.gz"
          cp "$tarball" "$dest"
          cp "$tarball.sig" "$dest.sig"
          ls -l update-artifacts

      - name: Upload updater artifacts
        if: env.HAVE_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buster-claw-update-${{ matrix.arch }}
          if-no-files-found: error
          path: update-artifacts/*

      # always(): a failed build must not leave a private key sitting on shared
      # infrastructure. This is the step whose absence nobody notices.
      - name: Tear down the signing keychain
        if: always() && env.HAVE_APPLE_CERT == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/busterclaw-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" || true

  # The join. Neither arch runner can build the feed: latest.json carries BOTH
  # signatures, and each runner only ever holds its own. This job is the one
  # place both halves exist at once (UPDATE_ROADMAP G-18).
  #
  # Tag-only. A workflow_dispatch run is a verification build — it must be able
  # to prove the pipeline works without publishing anything to the world.
  release:
    name: Publish release + update feed
    needs: dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Narrower than the workflow default (contents: read) is not possible here —
    # creating a release is a write. Scoped to this job so the two build jobs,
    # which handle the signing keys, keep the read-only token they have now.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect every architecture's artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather the bundles into one directory
        run: |
          set -euo pipefail
          mkdir -p feed dist
          # download-artifact nests each upload under its own name; the feed
          # script wants them flat, and the DMGs are uploaded alongside.
          find artifacts -name '*.app.tar.gz' -exec cp {} feed/ \;
          find artifacts -name '*.app.tar.gz.sig' -exec cp {} feed/ \;
          find artifacts -name '*.dmg' -exec cp {} dist/ \;
          echo "== update bundles ==" && ls -l feed
          echo "== disk images ==" && ls -l dist

      # Fails closed if either architecture is missing or unsigned. A feed that
      # describes one arch is not a partial success — it is an update that never
      # arrives for everyone on the other one, with no error on their end.
      - name: Build the update feed
        run: |
          set -euo pipefail
          ./scripts/build_update_feed.sh \
            --tag "${GITHUB_REF_NAME}" \
            --dir feed \
            --out feed/latest.json \
            --repo "${GITHUB_REPOSITORY}"
          cat feed/latest.json

      # latest.json is what https://busterclaw.lol/updates/latest.json rewrites
      # to, so it must be an asset on the release marked `latest`. The DMGs are
      # the first-install path; the tarballs are what the updater downloads.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Buster Claw ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.dmg \
            feed/*.app.tar.gz \
            feed/*.app.tar.gz.sig \
            feed/latest.json

      # The endpoint is compiled into every shipped binary and cannot be changed
      # for installs already in the wild (UPDATE_ROADMAP D5). It resolves through
      # a Vercel rewrite in the SEPARATE website repo, which this pipeline cannot
      # see — so it is checked here, after publishing, where a failure is a loud
      # warning rather than a silent 404 on every user's machine months from now.
      - name: Check the public endpoint resolves
        continue-on-error: true
        run: |
          set -uo pipefail
          URL="https://busterclaw.lol/updates/latest.json"
          echo "==> GET $URL"
          code="$(curl -sSL -o /tmp/feed.json -w '%{http_code}' "$URL" || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::warning title=Update endpoint unreachable::$URL returned $code."
            echo "The release published fine, but no installed app can SEE it until"
            echo "the website repo rewrites /updates/latest.json to this release."
            exit 0
          fi
          published="$(grep -o '\"version\"[^,]*' /tmp/feed.json | head -1 || true)"
          echo "endpoint serving: $published"
